name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting and lint rules
        run: sbt scalafmtCheckAll "scalafixAll --check"

      - name: Run Scala.js test suite
        run: sbt test

      - name: Compile production Scala.js bundle
        run: sbt fullLinkJS

      - name: Build frontend
        run: npm run build
