name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.puml'
      - '**.graphml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SBT_OPTS: "-Xmx3g"

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
        with:
          # Its disk cache is for sbt 2.x; on this build's sbt 1.x the folder never exists, and the
          # post step only warns that it has nothing to save.
          disk-cache: false

      - name: Restore incremental compilation state
        # setup-java's `cache: sbt` stores downloaded dependencies only, never compiled output.
        # Keyed on the commit; restore-keys falls back to the most recent state, so only what
        # changed is recompiled (scalafix's semantic rules need a full compile otherwise).
        id: restore-target
        uses: actions/cache/restore@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-sbt-target-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sbt-target-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting and lint, test, and link the production bundle
        # One sbt invocation: each separate `sbt` call starts a new JVM and reloads the build.
        run: sbt scalafmtCheckAll "scalafixAll --check" test fullLinkJS

      - name: Save incremental compilation state
        # Not on pull requests: a PR's cache is scoped to its merge ref, so main can never restore
        # it, and saving one per PR push only churns the repository's cache quota. Same split as
        # aero-hex-ai's scala.yml.
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: |
            **/target
          key: ${{ steps.restore-target.outputs.cache-primary-key }}

      - name: Build frontend
        run: npm run build
