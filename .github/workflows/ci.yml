name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.puml'
      - '**.graphml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SBT_OPTS: "-Xmx3g"

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache incremental compilation state
        # setup-java's `cache: sbt` stores downloaded dependencies only, never compiled output.
        # Keyed on the commit; restore-keys falls back to the most recent state, so only what
        # changed is recompiled (scalafix's semantic rules need a full compile otherwise).
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-sbt-target-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sbt-target-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting and lint, test, and link the production bundle
        # One sbt invocation: each separate `sbt` call starts a new JVM and reloads the build.
        run: sbt scalafmtCheckAll "scalafixAll --check" test fullLinkJS

      - name: Build frontend
        run: npm run build
